<!--
  SNS に貼る「1本のリンク」（2026-11-24 作成、11-25 作り直し）。
  https://starwiz.co.jp/munchcal?src=tiktok のように開くと、
    iPhone・iPad → App Store、Android → Google Play に自動で進む。パソコンなどでは両方のバッジを出す。
  TikTok・Instagram の中のブラウザで自動で進まない時のために、バッジは常に出しておく。
  src（どこから来たか）は App Store の ct、Google Play の referrer（utm_source）に渡す。
  開いた数：Supabase の events 表に name='link.open'（開いた）／'link.click'（バッジを押した）で1行ずつ入れる。
    個人を特定する情報は入れない（端末ごとの乱数・どこから来たか・端末の種類・言語だけ）。
    数え方の SQL は starwiz-kit/docs/supabase-events.sql と同じ表。
  アイコンはページに埋め込んである（ストアへ進むと読み込み中の画像が止まり、空白になるため）。
-->
<style>
  :root{--bg:#FFEEE8;--paper:#FFFFFF;--ink:#222222;--sub:#6B6B6B;--mute:#9A8A84;--line:#F3DED6;--brand:#FF6537;color-scheme:light}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
  main{max-width:460px;margin:0 auto;padding:40px 16px 32px}
  .card{background:var(--paper);border-radius:28px;padding:28px 20px 24px;box-shadow:0 10px 30px rgba(214,66,24,.10);text-align:center}
  .logo{width:112px;height:112px;border-radius:26px;display:block;margin:0 auto 16px;box-shadow:0 8px 20px rgba(214,66,24,.22)}
  h1{font-size:26px;margin:0;line-height:1.3;letter-spacing:.01em}
  .sub{margin:4px 0 2px;font-size:15px;color:var(--sub)}
  .dev{margin:0;font-size:13px;color:var(--mute)}
  .chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:16px 0 22px;padding:0;list-style:none}
  .chips li{font-size:12px;color:#B3471F;background:#FFF3EE;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .badges{display:flex;flex-direction:column;align-items:center;gap:12px}
  .badges a{display:block;line-height:0;border-radius:10px;-webkit-tap-highlight-color:transparent}
  .badges a:active{opacity:.75}
  .badges img{height:56px;width:auto;display:block}
  .status{font-size:13px;color:var(--sub);margin:14px 0 0;min-height:20px}
  .shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -20px 0;padding:0 20px 6px;scrollbar-width:none}
  .shots::-webkit-scrollbar{display:none}
  .shots img{flex:none;width:42%;max-width:170px;aspect-ratio:1320/2868;height:auto;border-radius:16px;scroll-snap-align:center;background:#FFF3EE;border:1px solid var(--line)}
  .pc{margin:18px 0 0;font-size:13px;color:var(--sub)}
  footer{margin-top:22px;text-align:center;font-size:12px;color:var(--mute);line-height:2}
  footer a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(154,138,132,.4)}
  @media (min-width:700px){.badges{flex-direction:row;justify-content:center}.badges img{height:52px}}
</style>
</head>

<script>
(function () {
  var APP_STORE_ID = '6827327851';
  var PLAY_PACKAGE = 'jp.co.starwiz.pakumi';
  var PT = ''; // App Store Connect の「会社の番号（provider token）」。わかったら入れると、App Store Connect でも src ごとの数が出る
  var SUPABASE_URL = 'https://dyfrhyywdousgirlpksj.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_6mifftlLfMeXnXjSLCMWtA_w7mh5keb'; // 公開してよい鍵（アプリにも入っている）。表には「足す」ことしかできない

  // どこから来たか（?src=tiktok など）。英数字・-・_ だけ、40文字まで
  var m = location.search.match(/[?&]src=([^&#]*)/);
  var src = '';
  try { src = m ? decodeURIComponent(m[1]) : ''; } catch (e) { src = ''; }
  src = src.toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'direct';

  var ios = 'https://apps.apple.com/app/id' + APP_STORE_ID + '?ct=' + encodeURIComponent(src) + (PT ? '&pt=' + encodeURIComponent(PT) + '&mt=8' : '');
  var android = 'https://play.google.com/store/apps/details?id=' + PLAY_PACKAGE + '&referrer=' +
    encodeURIComponent('utm_source=' + src + '&utm_medium=smartlink&utm_campaign=munchcal');

  var $ = function (id) { return document.getElementById(id); };
  $('ios').href = ios;
  $('android').href = android;

  var ua = navigator.userAgent || '';
  // iPadOS はパソコンの Mac と名乗るので、指で触れる画面かどうかで見分ける
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var platform = isIOS ? 'ios' : isAndroid ? 'android' : 'desktop';
  var inapp = /musical_ly|BytedanceWebview|TikTok/i.test(ua) ? 'tiktok'
    : /Instagram/i.test(ua) ? 'instagram'
    : /FBAN|FBAV|FB_IAB/i.test(ua) ? 'facebook'
    : /\bLine\//i.test(ua) ? 'line'
    : /Twitter/i.test(ua) ? 'x'
    : /YouTube/i.test(ua) ? 'youtube' : 'none';
  var lang = (navigator.language || '').toLowerCase();
  var ja = lang.indexOf('ja') === 0;

  // 日本語以外の人には英語で
  if (!ja) {
    document.documentElement.lang = 'en';
    document.title = 'MunchCal: AI Calorie Tracker';
    $('sub').textContent = 'AI Calorie Tracker & Food Diary';
    $('dev').textContent = 'STARWIZ Inc.';
    $('chips').innerHTML = '<li>Snap a photo to log</li><li>Free to start</li><li>iPhone & Android</li>';
    $('iosImg').src = '/img/badges/appstore-en.svg'; $('iosImg').alt = 'Download on the App Store'; $('ios').setAttribute('aria-label', 'Download on the App Store');
    $('andImg').src = '/img/badges/googleplay-en.png'; $('andImg').alt = 'Get it on Google Play'; $('android').setAttribute('aria-label', 'Get it on Google Play');
    var shots = $('shots').getElementsByTagName('img');
    var alts = ['Log meals with your pet', 'Snap to count calories', 'Your pet eats what you eat'];
    for (var i = 0; i < shots.length; i++) { shots[i].src = '/img/munchcal/ss-en-' + (i + 1) + '.jpg'; shots[i].alt = alts[i]; }
    $('pc').textContent = 'Open this page on your phone to go straight to the store.';
    $('by').textContent = 'By ';
    $('privacy').textContent = 'Privacy Policy'; $('support').textContent = 'Support';
  }

  // ---- 開いた数の記録（個人を特定する情報は送らない） ----
  function rand(n) {
    var s = '', c = '0123456789abcdef';
    try { var a = new Uint8Array(n); crypto.getRandomValues(a); for (var i = 0; i < n; i++) s += c[a[i] & 15]; }
    catch (e) { for (var j = 0; j < n; j++) s += c[Math.floor(Math.random() * 16)]; }
    return s;
  }
  var device = '';
  try { device = localStorage.getItem('sw_link_device') || ''; if (!device) { device = rand(32); localStorage.setItem('sw_link_device', device); } }
  catch (e) { device = rand(32); }
  var session = rand(12);
  var refHost = '';
  try { refHost = document.referrer ? new URL(document.referrer).hostname.slice(0, 64) : ''; } catch (e) {}

  function log(name, extra) {
    var props = { src: src, platform: platform, inapp: inapp, lang: lang.slice(0, 8), ref: refHost };
    if (extra) for (var k in extra) props[k] = extra[k];
    try {
      return fetch(SUPABASE_URL + '/rest/v1/events', {
        method: 'POST', keepalive: true,
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ app: 'pakumi', device_id: device, session: session, name: name, props: props, at: new Date().toISOString() })
      }).catch(function () {});
    } catch (e) { return Promise.resolve(); }
  }
  // 時間がかかっても、ストアへ進むのを待たせすぎない
  function within(p, ms) { return Promise.race([p, new Promise(function (r) { setTimeout(r, ms); })]); }

  var opened = log('link.open');
  $('ios').addEventListener('click', function () { log('link.click', { store: 'app_store' }); });
  $('android').addEventListener('click', function () { log('link.click', { store: 'google_play' }); });

  if (isIOS || isAndroid) {
    // 自分の端末のバッジを上に
    if (isAndroid) $('badges').insertBefore($('android'), $('ios'));
    $('status').textContent = ja ? 'ストアを開いています…' : 'Opening the store…';
    within(opened, 700).then(function () {
      location.replace(isIOS ? ios : android);
      // 自動で進まなかった時（アプリ内ブラウザなど）のための一言
      setTimeout(function () {
        $('status').textContent = ja ? '自動で開かない時は、上のボタンから開けます。' : 'If the store didn’t open, tap the button above.';
      }, 1800);
    });
  } else {
    $('pc').hidden = false;
  }
})();
</script>
